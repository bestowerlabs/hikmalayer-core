[package]
name = "hikmalayer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
axum = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9.2"
uuid = { version = "1", features = ["v4"] }
tower = "0.4"
tower-http = { version = "0.6.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["json"] }

# Authentication dependencies
secp256k1 = { version = "0.28", features = ["recovery", "rand"] }
sha3 = "0.10"
hex = "0.4"
jsonwebtoken = "9.2"  # Optional: for JWT tokens instead of UUIDs

# Optional: For more secure session management
argon2 = "0.5"        # For password hashing if you add password auth
base64 = "0.21"       # For encoding/decoding
schnorrkel = "0.11"
hmac = "0.12"         # R-05: HMAC-signed self-expiring admin/P2P tokens
subtle = "2"          # Constant-time comparisons (timing side channels)

# Release builds keep integer overflow checks ON.
#
# This is deliberately not the Rust default. In a state machine that moves
# money, a wrapped `u64` is not a rounding error: it mints supply or destroys
# funds, silently and irreversibly, and every node computes the same wrong
# answer so consensus never notices.
#
# The state machine uses checked arithmetic everywhere, so these checks should
# never fire. They are the backstop for the line someone adds later: a halted
# node is recoverable, a corrupted ledger is not.
[profile.release]
overflow-checks = true
