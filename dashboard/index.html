<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy — the primary containment for a wallet-bearing
      page. Even if a script injection ever occurs (a dependency compromise, a
      future regression), this policy denies the two things an attacker needs:

        script-src 'self'   → injected inline/remote scripts do not execute
        connect-src (list)  → a stolen key cannot be POSTed to an attacker host
        object/base/form    → no plugins, no <base> hijack, no form exfiltration

      'unsafe-inline' is required in style-src only because React sets inline
      style attributes (animation delays); it does NOT permit script execution.

      connect-src is extended automatically at build time with VITE_API_BASE
      (see vite.config.js), so a dashboard pointed at a real node is not
      blocked by its own policy.

      Deployments should ALSO serve this policy as a real HTTP header. A
      header can enforce `frame-ancestors 'none'` — the anti-clickjacking
      directive that protects the signing confirmation — which a meta tag
      cannot. It is deliberately omitted below rather than included and
      ignored: browsers reject it here and log an error on every page load,
      which trains people to ignore console errors. See
      docs/wallet_security.md §4 for the header to serve.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self' http://127.0.0.1:3000 http://localhost:3000;
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />

    <title>Hikmalayer Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
