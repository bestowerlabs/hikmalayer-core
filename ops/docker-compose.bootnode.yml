services:
  bootnode:
    build: .
    container_name: hikmalayer-bootnode
    environment:
      NODE_ID: bootnode
      VALIDATOR_PRIVATE_KEY: ${BOOTNODE_VALIDATOR_KEY}
      TREASURY_PRIVATE_KEY: ${BOOTNODE_TREASURY_KEY}
      GENESIS_TREASURY_ADDRESS: ${GENESIS_TREASURY_ADDRESS}
      GENESIS_VALIDATOR_PUBLIC_KEY: ${GENESIS_VALIDATOR_PUBLIC_KEY}
      GENESIS_VALIDATOR_VRF_PUBLIC_KEY: ${GENESIS_VALIDATOR_VRF_PUBLIC_KEY}
      P2P_TOKEN: ${P2P_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      P2P_ALLOWLIST: ${P2P_ALLOWLIST}
      P2P_REQUIRE_IDENTITY: "true"
      RUST_LOG: info
    ports:
      - "3000:3000"
    restart: unless-stopped

  hikmalayer-exporter:
    image: python:3.11-alpine
    container_name: hikmalayer-exporter
    volumes:
      - ./ops/hikmalayer_exporter.py:/exporter.py:ro
    command: ["sh", "-c", "python3 /exporter.py"]
    ports:
      - "8000:8000"
    depends_on:
      - bootnode
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: hikmalayer-prometheus
    volumes:
      - ./ops/prometheus/prometheus.mainnet.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: hikmalayer-grafana
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: hikmalayer-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./ops/caddy/Caddyfile.mainnet:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - bootnode
    restart: unless-stopped

volumes:
  caddy_data:
