<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hikmalayer Wallet</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 380px;
        min-height: 520px;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8ecf5;
        background: linear-gradient(160deg, #0f172a 0%, #2a1249 55%, #0f172a 100%);
      }
      .wrap { padding: 18px; }
      h1 { font-size: 17px; margin: 0 0 2px; }
      h2 { font-size: 15px; margin: 0 0 10px; }
      .muted { color: #9aa6bf; font-size: 12px; margin: 0 0 14px; }
      .card {
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .addr { font-size: 11px; word-break: break-all; color: #7ee7c7; }
      .msg {
        font-size: 11px; word-break: break-all; color: #8fe3ff;
        background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.1);
        border-radius: 8px; padding: 10px; max-height: 180px; overflow-y: auto;
      }
      input {
        width: 100%; padding: 9px 10px; margin-bottom: 8px;
        background: rgba(255,255,255,.08); color: #fff;
        border: 1px solid rgba(255,255,255,.18); border-radius: 9px; font-size: 13px;
      }
      input:focus { outline: 2px solid rgba(45,212,191,.5); }
      button {
        width: 100%; padding: 10px; border: 0; border-radius: 10px;
        font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
        background: linear-gradient(90deg, #10b981, #14b8a6); color: #05221b;
      }
      button.ghost { background: rgba(255,255,255,.1); color: #e8ecf5; }
      button.danger { background: rgba(239,68,68,.25); color: #fecaca; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .row { display: flex; gap: 8px; }
      .row > button { margin-top: 0; }
      .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
      .tabs button { background: rgba(255,255,255,.06); color: #cbd5e1; font-weight: 500; }
      .tabs button.active { background: rgba(16,185,129,.28); color: #fff; }
      .pill {
        float: right; font-size: 11px; padding: 2px 8px; border-radius: 8px;
        background: rgba(255,255,255,.08); color: #cbd5e1;
      }
      .pill.on { background: rgba(16,185,129,.22); color: #6ee7b7; }
      .warn {
        background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35);
        border-radius: 10px; padding: 10px; font-size: 12px; color: #fcd9a0;
      }
      .err { color: #fca5a5; font-size: 12px; margin-top: 8px; }
      .ok { color: #86efac; font-size: 12px; margin-top: 8px; }
      .site { font-size: 12px; display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
      .site button { width: auto; padding: 3px 8px; font-size: 11px; margin: 0; }
      .hidden { display: none; }
      .acct {
        display: flex; align-items: center; gap: 8px; padding: 7px 8px;
        border-radius: 9px; border: 1px solid transparent; cursor: pointer;
      }
      .acct:hover { background: rgba(255,255,255,.06); }
      .acct.active { background: rgba(16,185,129,.16); border-color: rgba(16,185,129,.4); }
      .acct .who { flex: 1; min-width: 0; }
      .acct .name { font-size: 12px; color: #fff; }
      .acct .tiny { font-size: 10px; color: #8fa0bd; font-family: ui-monospace, Menlo, monospace; }
      .acct button { width: auto; padding: 3px 7px; font-size: 10px; margin: 0; }
      .check { color: #6ee7b7; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app" class="wrap"></div>
    <script src="popup.js"></script>
  </body>
</html>
